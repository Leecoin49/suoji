name: Question
description: Ask how something works or whether Suoji fits your case.
title: "[Question] "
labels: ["question"]
body:
  - type: textarea
    id: question
    attributes:
      label: Your question
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: How do you use Suoji now, and what are you trying to do?
    validations:
      required: false
