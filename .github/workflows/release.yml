name: Release

on:
  push:
    tags:
      - "v*"
    # Building this branch runs every platform leg without publishing anything.
    branches:
      - ci/release-dryrun
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (its version names the assets)"
        required: true
        type: string
      dry_run:
        description: "Build all platforms but do not publish a release"
        required: false
        default: true
        type: boolean

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ inputs.tag || (github.ref_type == 'tag' && github.ref_name || 'v0.0.0-dryrun') }}

jobs:
  build:
    name: build (${{ matrix.platform }}, ${{ matrix.target }})
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        # Same six legs as dbx: two macOS, two Linux, two Windows architectures.
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            key: darwin-aarch64
            arch: arm64
            bundles: app,dmg
          - platform: macos-15-intel
            target: x86_64-apple-darwin
            key: darwin-x86_64
            arch: x64
            bundles: app,dmg
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            key: linux-x86_64
            arch: amd64
            bundles: deb,appimage
          - platform: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            key: linux-aarch64
            arch: arm64
            bundles: deb,appimage
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            key: windows-x86_64
            arch: x64
            bundles: nsis
          - platform: windows-latest
            target: aarch64-pc-windows-msvc
            key: windows-aarch64
            arch: arm64
            bundles: nsis
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Install Linux dependencies
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libgtk-3-dev \
            patchelf

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          key: ${{ matrix.target }}

      - name: Prepare the updater signing key
        id: signing
        shell: bash
        env:
          SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$SIGNING_KEY" ]; then
            echo "signed=0" >> "$GITHUB_OUTPUT"
            echo "::warning::TAURI_SIGNING_PRIVATE_KEY is empty; building without updater artifacts."
            exit 0
          fi
          echo "signed=1" >> "$GITHUB_OUTPUT"
          # The CLI wants the key itself or a path to it, never base64.
          key_file="$RUNNER_TEMP/updater.key"
          if printf '%s' "$SIGNING_KEY" | head -c 17 | grep -q 'untrusted comment'; then
            printf '%s' "$SIGNING_KEY" > "$key_file"
          else
            printf '%s' "$SIGNING_KEY" | tr -d '\r\n ' | base64 -d > "$key_file"
          fi
          echo "key_path=$key_file" >> "$GITHUB_OUTPUT"

      - name: Build
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ steps.signing.outputs.key_path }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          SIGNED: ${{ steps.signing.outputs.signed }}
        run: |
          extra=""
          if [ "$SIGNED" != "1" ]; then
            # A file, because PowerShell would strip the quotes of inline JSON.
            printf '{"bundle":{"createUpdaterArtifacts":false}}' > unsigned.conf.json
            extra="--config unsigned.conf.json"
          fi
          pnpm tauri build \
            --target "${{ matrix.target }}" \
            --bundles "${{ matrix.bundles }}" \
            $extra

      - name: Collect release assets
        shell: bash
        env:
          SIGNED: ${{ steps.signing.outputs.signed }}
        run: |
          echo "bundles produced:"
          find "src-tauri/target/${{ matrix.target }}/release/bundle" -type f | sort || true
          args=""
          if [ "$SIGNED" != "1" ]; then args="--unsigned"; fi
          node .github/scripts/collect-assets.mjs \
            --version "${RELEASE_TAG#v}" \
            --target "${{ matrix.target }}" \
            --platform "${{ matrix.key }}" \
            --arch "${{ matrix.arch }}" \
            --out dist $args

      - uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ matrix.key }}
          path: dist
          if-no-files-found: error

  publish:
    name: publish release
    needs: build
    if: ${{ !inputs.dry_run && github.ref != 'refs/heads/ci/release-dryrun' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/download-artifact@v4
        with:
          pattern: bundle-*
          merge-multiple: true
          path: assets

      - name: Assemble latest.json
        env:
          GH_REPO_NAME: ${{ github.repository }}
        run: |
          node .github/scripts/make-manifest.mjs \
            --dir assets \
            --repo "$GH_REPO_NAME" \
            --tag "$RELEASE_TAG" \
            --notes-file "release-notes/${RELEASE_TAG#v}.md"

      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="$RELEASE_TAG"
          notes="notes.md"
          # Keep the release as a draft until every platform has uploaded.
          gh release create "$tag" --title "Suoji $tag" --notes-file "$notes" \
            --verify-tag --draft || \
            gh release edit "$tag" --title "Suoji $tag" --notes-file "$notes"
          gh release upload "$tag" assets/* --clobber
          gh release edit "$tag" --draft=false

          # A release that silently stays a draft is invisible to the updater.
          draft="$(gh release view "$tag" --json isDraft --jq .isDraft)"
          if [ "$draft" != "false" ]; then
            echo "::error::Release $tag is still a draft."
            exit 1
          fi

          gh release download "$tag" --pattern latest.json --dir verify --clobber
          node -e '
            const m = require("./verify/latest.json");
            const want = ["darwin-aarch64", "darwin-x86_64", "linux-x86_64", "linux-aarch64", "windows-x86_64", "windows-aarch64"];
            const missing = want.filter((p) => !m.platforms[p]?.url || !m.platforms[p]?.signature);
            if (missing.length) throw new Error("latest.json is missing: " + missing.join(", "));
            console.log(`published ${m.version} for ${want.length} platforms`);
          '
          gh release view "$tag" --json assets --jq '.assets[].name'
