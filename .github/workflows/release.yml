name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (for example v0.1.0)"
        required: true

permissions:
  contents: write

jobs:
  release:
    name: build windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare updater signing key
        id: signing
        shell: pwsh
        env:
          KEY_RAW: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:KEY_RAW)) {
            Write-Host "::warning::TAURI_SIGNING_PRIVATE_KEY is not set - the build will not produce signed updater artifacts."
            exit 0
          }
          # The secret may hold the key itself or a base64 copy of the key file.
          $key = $env:KEY_RAW.Trim()
          if ($key -notmatch '^untrusted comment') {
            $key = [System.Text.Encoding]::UTF8.GetString([Convert]::FromBase64String($key))
          }
          $path = Join-Path $env:RUNNER_TEMP 'updater.key'
          [System.IO.File]::WriteAllText($path, $key)
          "key_path=$path" >> $env:GITHUB_OUTPUT
          if ($env:KEY_PASSWORD) { "TAURI_SIGNING_PRIVATE_KEY_PASSWORD=$($env:KEY_PASSWORD)" >> $env:GITHUB_ENV }

      - name: Build (NSIS installer)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ steps.signing.outputs.key_path }}
        run: pnpm tauri build --bundles nsis

      # The bundle is named after productName (琐记), and non-ASCII file names get mangled
      # on the Windows runner, so the assets are renamed to ASCII before publishing.
      - name: Collect assets
        shell: pwsh
        run: |
          $tag = "${{ inputs.tag || github.ref_name }}"
          $version = $tag.TrimStart('v')
          $setup = Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1
          $sig = Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe.sig | Select-Object -First 1
          if (-not $sig) { throw "missing updater signature: is TAURI_SIGNING_PRIVATE_KEY configured?" }
          New-Item -ItemType Directory -Force assets | Out-Null
          Copy-Item $setup.FullName "assets/SuoJi_${version}_x64-setup.exe"
          Copy-Item src-tauri/target/release/suoji.exe "assets/SuoJi_${version}_x64-portable.exe"

          # latest.json is what the updater endpoints point at; the signature inside it
          # is the minisign signature of the installer above.
          $notesFile = "release-notes/$version.md"
          if (Test-Path $notesFile) {
            $notes = ([System.IO.File]::ReadAllText((Resolve-Path $notesFile))).Trim()
          } else {
            $notes = "See the release page for what changed."
          }

          $base = "https://github.com/${{ github.repository }}/releases/download/$tag"
          $manifest = [ordered]@{
            version   = $version
            notes     = $notes
            pub_date  = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
            platforms = [ordered]@{
              "windows-x86_64" = [ordered]@{
                signature = (Get-Content $sig.FullName -Raw).Trim()
                url       = "$base/SuoJi_${version}_x64-setup.exe"
              }
            }
          }
          $json = $manifest | ConvertTo-Json -Depth 6
          [System.IO.File]::WriteAllText((Join-Path $PWD 'assets/latest.json'), $json, (New-Object System.Text.UTF8Encoding($false)))

          # Same text as the release body, plus the download list GitHub readers expect.
          $footer = @"

          ---

          - ``SuoJi_${version}_x64-setup.exe`` - installer, per-user, no admin rights
          - ``SuoJi_${version}_x64-portable.exe`` - portable, nothing to install
          - ``latest.json`` - update manifest read by the app
          "@
          [System.IO.File]::WriteAllText((Join-Path $PWD 'notes.md'), ($notes + $footer), (New-Object System.Text.UTF8Encoding($false)))
          Get-ChildItem assets | Select-Object Name, Length

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = "${{ inputs.tag || github.ref_name }}"
          $assets = Get-ChildItem assets/* | ForEach-Object { $_.FullName }

          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            # Drop stale assets from earlier runs that mangled the non-ASCII name.
            $stale = gh release view $tag --json assets --jq '.assets[].name' 2>$null
            foreach ($name in $stale) {
              if ($name -and $name -ne 'latest.json' -and $name -notmatch '^SuoJi_.*\.exe$') {
                Write-Host "removing stale asset: $name"
                gh release delete-asset $tag $name --yes
              }
            }
            gh release upload $tag @assets --clobber
          } else {
            gh release create $tag @assets --title "Suoji $tag" --notes-file notes.md --verify-tag
          }

          # Deleting a tag silently turns its release into a draft, so force it public.
          gh release edit $tag --draft=false --title "Suoji $tag" --notes-file notes.md

          $view = gh release view $tag --json isDraft,assets | ConvertFrom-Json
          "published: tag=$tag draft=$($view.isDraft)"
          $view.assets | ForEach-Object { "  - $($_.name)" }
          if ($view.isDraft) { throw "release $tag is still a draft" }
